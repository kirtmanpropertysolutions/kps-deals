<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0f2f5;font-family:'Outfit',sans-serif;color:#1c1c2e}
input,select,textarea{outline:none;font-family:'Outfit',sans-serif}
input::placeholder,textarea::placeholder{color:#b0b8c8}
button{cursor:pointer;font-family:'Outfit',sans-serif;transition:all .15s}
button:hover{opacity:.88}button:active{transform:scale(.98)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#d0d5e0;border-radius:4px}
.nav-btn{border:none;background:transparent;padding:8px 18px;font-size:13px;font-weight:500;color:#7a8499;border-radius:6px}
.nav-btn.active{background:#fff;color:#8B1A1A;box-shadow:0 1px 4px rgba(0,0,0,0.1)}
.nav-btn:hover{color:#1c1c2e;background:rgba(255,255,255,0.6)}
.tab-btn{flex:1;padding:8px 6px;border:none;border-radius:6px;font-size:12px;font-weight:500;color:#7a8499;background:transparent;letter-spacing:.03em;text-transform:uppercase}
.tab-btn.active{background:#8B1A1A;color:#fff;box-shadow:0 2px 6px rgba(139,26,26,0.3)}
.tab-btn:hover:not(.active){background:rgba(139,26,26,0.06);color:#8B1A1A}
.preset-btn{background:#fff;border:1px solid #e2e6ed;border-radius:6px;padding:6px 14px;font-size:12px;font-weight:500;color:#4a5568}
.preset-btn:hover{border-color:#8B1A1A;color:#8B1A1A;background:#fdf5f5}
.filter-btn{background:#fff;border:1px solid #e2e6ed;border-radius:20px;padding:5px 14px;font-size:12px;font-weight:500;color:#4a5568}
.filter-btn.active{background:#8B1A1A;border-color:#8B1A1A;color:#fff}
.filter-btn:hover:not(.active){border-color:#8B1A1A;color:#8B1A1A}
.metric-card{background:#fff;border:1px solid #e8ecf2;border-radius:8px;padding:12px 14px;transition:all .15s}
.metric-card:hover{border-color:#8B1A1A;box-shadow:0 2px 8px rgba(139,26,26,0.08)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .3s ease forwards}
@keyframes spin{to{transform:rotate(360deg)}}.spin{animation:spin 1s linear infinite;display:inline-block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:640px){.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
input:focus,select:focus{border-color:#8B1A1A!important;box-shadow:0 0 0 3px rgba(139,26,26,0.08)!important}
.deal-row{background:#fff;border:1px solid #e8ecf2;border-radius:8px;padding:14px 16px;display:flex;align-items:center;gap:14px;transition:all .15s}
.deal-row:hover{border-color:#8B1A1A;box-shadow:0 2px 8px rgba(139,26,26,0.06)}
body{overflow-x:hidden}
@media(max-width:640px){
  .nav-strip{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:calc(100vw - 90px);flex-shrink:1}
  .nav-strip .nav-btn{white-space:nowrap;font-size:11px;padding:6px 10px}
  .app-hdr{height:auto!important;padding:10px 14px!important;flex-wrap:wrap;gap:6px}
  .analyze-grid{grid-template-columns:1fr!important}
  .action-row{flex-wrap:wrap!important}
  .deal-row{flex-wrap:wrap!important}
  .pl-stats{width:100%;order:3;overflow-x:auto;padding-bottom:2px;gap:10px!important}
  .pl-btns{width:100%;order:4;margin-top:6px}
  .pl-btns>*{flex:1!important;text-align:center!important}
  .sv-btns{width:100%;margin-top:6px;flex-wrap:wrap!important}
  .sv-btns>*{flex:1!important;text-align:center!important;min-width:70px}
  .pl-name{max-width:100%!important;white-space:normal!important;overflow:visible!important;text-overflow:unset!important}
  .irr-assume{grid-template-columns:repeat(2,1fr)!important}
  .irr-stress{grid-template-columns:1fr!important}
  .tab-strip{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tab-strip .tab-btn{white-space:nowrap;font-size:11px;padding:7px 4px}
}
</style>
